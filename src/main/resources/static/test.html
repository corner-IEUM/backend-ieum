<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>이음 통합 안내 테스트</title>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; }
        #status { color: #666; font-size: 14px; margin-bottom: 12px; }
        .panel { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
        .panel input { padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; }
        .panel button { padding: 7px 14px; border: none; border-radius: 6px; background: #35a; color: #fff; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { padding: 10px 12px; margin: 6px 0; border-radius: 8px; border-left: 4px solid #ccc; background: #f5f5f5; }
        li .tag { font-size: 12px; font-weight: 700; margin-right: 6px; }
        li.p1 { border-left-color: #e5484d; }         /* 즉각 위험 */
        li.p1 .tag { color: #e5484d; }
        li.p2 { border-left-color: #f2803d; }         /* 결정적 순간 */
        li.p2 .tag { color: #f2803d; }
        li.p3 { border-left-color: #8a9bb4; }         /* 일반 정보 */
        li.p3 .tag { color: #8a9bb4; }
    </style>
</head>
<body>
<h2>이음 — 통합 안내 스트림</h2>
<div id="status">연결 대기 중...</div>

<div class="panel">
    <input type="text" id="token" placeholder="accessToken (Bearer 제외)" style="width:260px">
    <input type="number" id="hazardLng" step="0.000001" placeholder="lng" style="width:110px">
    <input type="number" id="hazardLat" step="0.000001" placeholder="lat" style="width:110px">
    <button id="hazardBtn">근처 위험 확인 (기능 B)</button>
</div>

<ul id="log"></ul>

<script>
    const PRIORITY_LABEL = { 1: "즉각위험", 2: "결정적", 3: "일반" };

    const client = new StompJs.Client({
        brokerURL: 'ws://localhost:8080/ws',
    });

    client.onConnect = () => {
        document.getElementById('status').textContent = '연결됨 — /topic/guidance 구독 중';

        client.subscribe('/topic/guidance', (msg) => {
            const d = JSON.parse(msg.body);
            const li = document.createElement('li');
            li.className = 'p' + d.priority;
            const label = PRIORITY_LABEL[d.priority] || d.priority;
            li.innerHTML = `<span class="tag">[${label}·${d.kind}]</span>${d.message}`;
            document.getElementById('log').prepend(li);
        });
    };

    client.onStompError = (frame) => {
        document.getElementById('status').textContent = '오류: ' + frame.headers['message'];
    };

    client.activate();

    document.getElementById('hazardBtn').addEventListener('click', async () => {
        const token = document.getElementById('token').value.trim();
        const lng = Number(document.getElementById('hazardLng').value);
        const lat = Number(document.getElementById('hazardLat').value);
        try {
            const res = await fetch('/api/navigation/nearby-hazards', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...(token ? { Authorization: `Bearer ${token}` } : {}),
                },
                body: JSON.stringify({ lng, lat }),
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            // 결과는 이 요청의 응답이 아니라 위 /topic/guidance 구독으로 들어온다 (없으면 근처에 문제 없는 것)
        } catch (e) {
            document.getElementById('status').textContent = '위험 확인 요청 실패: ' + e.message;
        }
    });
</script>
</body>
</html>
