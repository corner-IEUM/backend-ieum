<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이음 — 횡단보도 안내 시뮬레이션</title>
<style>
  :root {
    --ink:        #0e1726;   /* 배경 */
    --panel:      #16223a;   /* 카드 */
    --panel-2:    #1d2c49;
    --line:       #2b3d5f;
    --path:       #3e5a7a;   /* 경로선 */
    --walker:     #35d0c0;   /* 사용자 위치 */
    --idle:       #5a6b86;   /* 대기 중 횡단보도 */
    --approach:   #f2b33d;   /* 접근(주의) */
    --arrive:     #f2603d;   /* 도착(신호 확인) */
    --done:       #4fcb6b;
    --text:       #e6edf6;
    --muted:      #8a9bb4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ink); color: var(--text);
    font-family: "Pretendard", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 28px 20px 48px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; }
  .controls {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    margin: 18px 0 20px; padding: 14px 16px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  }
  .controls label { color: var(--muted); font-size: 13px; }
  .controls input[type="number"] {
    width: 90px; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    font-size: 14px;
  }
  .controls .spacer { flex: 1; }
  .toggle { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; }
  button {
    padding: 9px 18px; border-radius: 8px; border: none; cursor: pointer;
    background: var(--walker); color: #04211e; font-weight: 700; font-size: 14px;
  }
  button:disabled { opacity: 0.45; cursor: default; }
  .grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .card h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  canvas { display: block; width: 100%; height: 440px; background: #0b1220; }
  .status { padding: 10px 16px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
  .status b { color: var(--text); font-weight: 600; }
  #feed { list-style: none; margin: 0; padding: 8px; max-height: 470px; overflow-y: auto; }
  #feed li {
    padding: 11px 13px; margin: 6px; border-radius: 9px; font-size: 14px; line-height: 1.4;
    background: var(--panel-2); border-left: 3px solid var(--line);
  }
  #feed li .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; display: block; margin-bottom: 3px; }
  #feed li.approach { border-left-color: var(--approach); }
  #feed li.approach .tag { color: var(--approach); }
  #feed li.arrive { border-left-color: var(--arrive); }
  #feed li.arrive .tag { color: var(--arrive); }
  #feed li.done { border-left-color: var(--done); }
  #feed li.done .tag { color: var(--done); }
  #feed li.sys .tag { color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; padding: 18px 16px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>이음 — 횡단보도 안내 시뮬레이션</h1>
    <span class="sub">저장된 경로를 따라 걷는 상황을 재생하고, 횡단보도 접근 시 안내를 내보냅니다</span>
  </header>

  <div class="controls">
    <label for="navId">길찾기 ID</label>
    <input type="number" id="navId" value="1" min="1">
    <button id="startBtn">시뮬레이션 시작</button>
    <span class="spacer"></span>
    <label class="toggle"><input type="checkbox" id="ttsToggle" checked> 음성 안내</label>
  </div>

  <div class="grid">
    <div class="card">
      <h2>경로</h2>
      <canvas id="map"></canvas>
      <div class="status" id="status">시작하면 경로가 표시됩니다.</div>
    </div>
    <div class="card">
      <h2>안내 피드</h2>
      <ul id="feed"><li class="empty" id="emptyMsg">아직 안내가 없습니다.</li></ul>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById("map");
  const ctx = canvas.getContext("2d");
  const feed = document.getElementById("feed");
  const statusEl = document.getElementById("status");
  const startBtn = document.getElementById("startBtn");

  let path = [], crosswalks = [], cwState = [], pos = null, bounds = null, ws = null;

  // 화면 크기에 맞춰 캔버스 해상도 세팅
  function sizeCanvas() {
    const r = canvas.getBoundingClientRect();
    canvas.width = r.width * devicePixelRatio;
    canvas.height = r.height * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  window.addEventListener("resize", () => { sizeCanvas(); draw(); });

  // 경로 경위도 → 캔버스 좌표 (여백 두고, 위도는 위아래 뒤집기)
  function project(lng, lat) {
    const w = canvas.width / devicePixelRatio, h = canvas.height / devicePixelRatio;
    const pad = 34;
    const { minLng, maxLng, minLat, maxLat } = bounds;
    const sx = (maxLng - minLng) || 1e-6, sy = (maxLat - minLat) || 1e-6;
    const scale = Math.min((w - pad * 2) / sx, (h - pad * 2) / sy);
    const ox = (w - sx * scale) / 2, oy = (h - sy * scale) / 2;
    return [ ox + (lng - minLng) * scale, h - (oy + (lat - minLat) * scale) ];
  }

  function computeBounds() {
    const lngs = path.map(p => p[0]), lats = path.map(p => p[1]);
    bounds = { minLng: Math.min(...lngs), maxLng: Math.max(...lngs),
               minLat: Math.min(...lats), maxLat: Math.max(...lats) };
  }

  function draw() {
    if (!bounds) return;
    const w = canvas.width / devicePixelRatio, h = canvas.height / devicePixelRatio;
    ctx.clearRect(0, 0, w, h);

    // 경로선
    ctx.strokeStyle = getVar("--path"); ctx.lineWidth = 3;
    ctx.lineJoin = "round"; ctx.beginPath();
    path.forEach((p, i) => {
      const [x, y] = project(p[0], p[1]);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.stroke();

    // 횡단보도 마커
    crosswalks.forEach((cw, i) => {
      const [x, y] = project(cw.lng, cw.lat);
      const st = cwState[i] || "idle";
      const color = st === "arrive" ? getVar("--arrive")
                  : st === "approach" ? getVar("--approach") : getVar("--idle");
      if (st !== "idle") {
        ctx.beginPath(); ctx.arc(x, y, 15, 0, Math.PI * 2);
        ctx.fillStyle = hexA(color, 0.22); ctx.fill();
      }
      ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2);
      ctx.fillStyle = color; ctx.fill();
      ctx.strokeStyle = "#0b1220"; ctx.lineWidth = 2; ctx.stroke();
    });

    // 사용자 위치
    if (pos) {
      const [x, y] = project(pos[0], pos[1]);
      ctx.beginPath(); ctx.arc(x, y, 13, 0, Math.PI * 2);
      ctx.fillStyle = hexA(getVar("--walker"), 0.25); ctx.fill();
      ctx.beginPath(); ctx.arc(x, y, 6.5, 0, Math.PI * 2);
      ctx.fillStyle = getVar("--walker"); ctx.fill();
      ctx.strokeStyle = "#04211e"; ctx.lineWidth = 2; ctx.stroke();
    }
  }

  const getVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
  }

  function addFeed(cls, tag, text) {
    document.getElementById("emptyMsg")?.remove();
    const li = document.createElement("li");
    li.className = cls;
    li.innerHTML = `<span class="tag">${tag}</span>${text}`;
    feed.insertBefore(li, feed.firstChild);
  }

  function speak(text) {
    if (!document.getElementById("ttsToggle").checked) return;
    if (!("speechSynthesis" in window)) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ko-KR"; u.rate = 1.05;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }

  startBtn.addEventListener("click", () => {
    const navId = document.getElementById("navId").value;
    if (ws) ws.close();
    feed.innerHTML = ""; addFeed("sys", "연결", "서버에 연결하는 중…");
    path = []; crosswalks = []; cwState = []; pos = null; bounds = null;

    const proto = location.protocol === "https:" ? "wss://" : "ws://";
    const host = location.host || "localhost:8080";  // 파일로 직접 열어도 동작
    ws = new WebSocket(proto + host + "/ws/simulate");

    ws.onopen = () => ws.send(JSON.stringify({ navigationId: Number(navId) }));
    ws.onerror = () => addFeed("sys", "오류", "연결에 실패했습니다. 서버가 켜져 있는지 확인하세요.");
    ws.onmessage = (ev) => handle(JSON.parse(ev.data));
  });

  function handle(msg) {
    switch (msg.type) {
      case "init":
        path = msg.path; crosswalks = msg.crosswalks;
        cwState = crosswalks.map(() => "idle");
        sizeCanvas(); computeBounds(); draw();
        addFeed("sys", "경로 로드", `좌표 ${path.length}개, 횡단보도 ${crosswalks.length}곳`);
        statusEl.innerHTML = `횡단보도 <b>${crosswalks.length}곳</b> · 경로 좌표 <b>${path.length}개</b>`;
        break;
      case "position":
        pos = [msg.lng, msg.lat]; draw();
        statusEl.innerHTML = `이동 중 · <b>${msg.index + 1}/${msg.total}</b>`;
        break;
      case "guidance": {
        const i = crosswalks.findIndex(c => c.guidance === msg.guidance);
        if (i >= 0) cwState[i] = msg.event;
        draw();
        const tag = msg.event === "arrive" ? "횡단보도 도착" : "횡단보도 접근";
        addFeed(msg.event, `${tag} · ${msg.distance}m`, msg.message);
        speak(msg.message);
        break;
      }
      case "done":
        addFeed("done", "도착", msg.message); speak(msg.message);
        statusEl.innerHTML = `<b>목적지 도착</b>`;
        break;
      case "error":
        addFeed("sys", "오류", msg.message);
        break;
    }
  }

  sizeCanvas();
</script>
</body>
</html>
