spring.application.name=ieum

# 서버
server.port=8080

# DB 연결
spring.datasource.url=jdbc:postgresql://localhost:5432/ieum_db
spring.datasource.username=ieum_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
# 스키마는 Flyway(src/main/resources/db/migration)가 관리하므로 Hibernate는 검증만 수행
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
# 기존 로컬/운영 DB에 이미 테이블이 있는 상태에서 Flyway를 처음 도입하는 전환 조치.
# V1은 CREATE TABLE IF NOT EXISTS로 작성되어 있어 기존 데이터를 건드리지 않고
# flyway_schema_history에만 기록됨. 새로 DB를 만드는 환경에서도 V1이 전체 스키마를 생성하므로 안전함.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT
jwt.secret=change-this-to-a-long-random-string-at-least-32-bytes
jwt.access-token-validity=604800000

# AI 서버 주소
ai.server.url=ws://localhost:8000/ws/detect

# Kakao (장소검색 전용)
kakao.rest-api-key=${KAKAO_REST_API_KEY}

# Tmap (보행자 경로 전용)
tmap.app-key=${TMAP_API_KEY}

# 버스 도착 정보 / 버스 정류소 API
seoul-bus.arrival-key=${SEOUL_BUS_ARRIVAL_KEY}
seoul-bus.stop-key=${SEOUL_BUS_STOP_KEY}