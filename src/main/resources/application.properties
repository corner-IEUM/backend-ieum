spring.application.name=ieum

# 서버
server.port=8080

# DB 연결
spring.datasource.url=jdbc:postgresql://localhost:5432/ieum_db
spring.datasource.username=ieum_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
# 원래 값: validate — crosswalks 테이블(팀원 담당, PostGIS geography 컬럼 사용 추정)이
# 로컬 DB에 없어 로컬 부팅이 막혀서 임시로 update로 완화함. crosswalks/PostGIS가
# schema.sql에 반영되면 반드시 validate로 되돌릴 것 (update는 스키마 드리프트를 조용히
# 허용해서 운영/CI 환경에서는 절대 쓰면 안 됨 — 로컬 임시 우회 전용)
# spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# schema.sql을 실제 DB(non-embedded)에서도 항상 실행 (기본값 embedded는 로컬 Postgres에서 스킵됨)
# ddl-auto=validate가 검증하기 전에 schema.sql로 누락된 테이블을 먼저 생성하기 위함
spring.sql.init.mode=always

# JWT
jwt.secret=change-this-to-a-long-random-string-at-least-32-bytes
jwt.access-token-validity=604800000

# AI 서버 주소
ai.server.url=ws://localhost:8000/ws/detect

# Kakao (장소검색 전용)
kakao.rest-api-key=${KAKAO_REST_API_KEY}

# Tmap (보행자 경로 전용)
tmap.app-key=${TMAP_API_KEY}